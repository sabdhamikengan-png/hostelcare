{% extends "base.html" %}
{% block title %}Login · HostelCare{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-title">Welcome back</div><div class="auth-subtitle">Sign in to manage your hostel support requests.</div>
  <form method="POST">
    <div class="field"><label class="form-label">Email address</label><input class="form-control" name="email" type="email" placeholder="you@example.com" required></div>
    <div class="field"><label class="form-label">Password</label><input class="form-control" name="password" type="password" placeholder="Enter your password" required></div>
    <button class="btn btn-primary w-100 py-2">Sign in <i class="bi bi-arrow-right ms-1"></i></button>
  </form>
  <p class="text-center mt-4 mb-0 panel-muted">New student? <a class="auth-link" href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
